<!doctype html>
<!-- El atributo "lang" especifica el idioma de la página web -->
<html lang="es">
<!-- Metadata de la página -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lección 1: Estructura HTML básica</title>
</head>
<!-- Contenido de la página -->
<body>
  <!-- Encabezado de la página -->
  <h1>¡Hola!</h1>
  <!-- Párrafo -->
  <p>¡Bienvenidos a mi primera página web hecha con HTML!</p>
</body>
</html>
